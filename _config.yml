name: &name tit4nium
avatar: &avatar /assets/images/avatar.jpeg
gh_user: &gh_user t1t4nium
gh_url: &gh_url https://github.com/t1t4nium
gh_sponsor: &gh_sponsor https://github.com/sponsors/t1t4nium
masto_url: &masto_url https://piaille.fr/@tit4nium
x_user: &x_user tit4nium8
x_url: &x_url https://x.com/tit4nium8

title: *name
tagline: journal de bord technique
description: >
  Carnet de bord de tit4nium : exploration, revues techniques et retours
  d'expérience sur l'IA et ses agents, les logiciels open source et la sécurité
  informatique.
url: https://tit4nium.fr
baseurl: /
lang: fr_FR
timezone: Europe/Paris
encoding: UTF-8

author:
  name: *name
  uri: 
  avatar: *avatar
  twitter: *x_user

mastodon:
  username: *name
  instance: piaille.fr

github:
  username: *gh_user

twitter:
  username: *x_user
  card: summary_large_image

logo: *avatar
social:
  name: *name
  links:
    - *gh_url
    - *masto_url
    - *x_url

permalink: /blog/:title/

pagination:
  enabled: true
  per_page: 16
  sort_field: date
  sort_reverse: true
  title: ":title - page :num"

autopages:
  enabled: true
  categories:
    enabled: false
  collections:
    enabled: false
  tags:
    enabled: true
    layouts:
      - autopage_tags.html
    title: "Tag :tag"
    permalink: /blog/tag/:tag
    slugify:
      mode: default
      case: false

redirect_from:
  json: false

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-redirect-from

feed:
  path: /blog/rss.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og-default.png
  - scope:
      path: _posts
    values:
      layout: post

social_links:
  - platform: github
    url: *gh_url
    label: GitHub
    icon: github.svg
  - platform: mastodon
    url: *masto_url
    label: Mastodon
    icon: mastodon.svg
  - platform: twitter
    url: *x_url
    label: X (Twitter)
    icon: twitter.svg
