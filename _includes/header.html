<header class="masthead">
  <div class="masthead-main">
    <a href="{{ '/blog/' | relative_url }}" class="brand">
      <img src="{% link assets/images/avatar.jpeg %}" alt="Avatar de {{ site.name }}" class="brand-avatar" width="44" height="44">
      <span class="brand-name">{{ site.name }}<span class="brand-slash">/</span>blog</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
    <label for="nav-toggle" class="nav-hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </label>
    <nav class="nav">
      {%- assign nav_pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" -%}
      {%- for p in nav_pages -%}
        {%- unless p.url contains '/page/' -%}
      <a href="{{ p.url | relative_url | replace: 'index.html', '' }}"{% if page.url == p.url %} class="on"{% endif %}>{{ p.nav_title }}</a>
        {%- endunless -%}
      {%- endfor -%}
      <a href="{{ site.feed.path | relative_url }}">rss</a>
      <span class="nav-social">
        {%- include social.html -%}
      </span>
      <button type="button" class="theme-toggle" aria-label="Changer de thème" aria-pressed="false">theme</button>
    </nav>
  </div>
</header>
