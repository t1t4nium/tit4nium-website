<head>
  <meta charset="{{ site.encoding }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  {% seo %}
  <meta property="twitter:domain" content="{{ site.url | remove: 'https://' }}">
  <meta name="fediverse:creator" content="@tit4nium@piaille.fr">
  <link rel="me" href="https://piaille.fr/@tit4nium">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.feed.path | absolute_url }}">
  <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ '/sitemap.xml' | absolute_url }}">
  <link rel="icon" type="image/jpeg" href="{% link assets/images/avatar.jpeg %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% link assets/css/style.css %}">
</head>
